<!DOCTYPE html>

<html class="dark" lang="zh"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Memory Vessel - Edit Summary</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Noto+Serif:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#23293c",
                        "inverse-surface": "#dce1fb",
                        "surface-tint": "#bec6e0",
                        "error": "#ffb4ab",
                        "on-tertiary": "#402d00",
                        "on-secondary": "#381385",
                        "on-secondary-fixed-variant": "#4f319c",
                        "tertiary-fixed": "#ffdf9f",
                        "tertiary": "#f9bd22",
                        "primary-container": "#0f172a",
                        "surface-bright": "#33394c",
                        "on-primary-container": "#798098",
                        "on-secondary-container": "#bea8ff",
                        "on-error": "#690005",
                        "on-background": "#dce1fb",
                        "secondary": "#cebdff",
                        "on-tertiary-fixed": "#261a00",
                        "inverse-primary": "#565e74",
                        "secondary-fixed": "#e8ddff",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#f9bd22",
                        "on-surface": "#dce1fb",
                        "surface-container-low": "#151b2d",
                        "outline": "#909097",
                        "surface-container-lowest": "#070d1f",
                        "on-primary-fixed": "#131b2e",
                        "primary": "#bec6e0",
                        "on-tertiary-fixed-variant": "#5c4300",
                        "surface-variant": "#2e3447",
                        "secondary-fixed-dim": "#cebdff",
                        "inverse-on-surface": "#2a3043",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-primary": "#283044",
                        "surface-dim": "#0c1324",
                        "error-container": "#93000a",
                        "background": "#0c1324",
                        "surface": "#0c1324",
                        "surface-container": "#191f31",
                        "secondary-container": "#4f319c",
                        "outline-variant": "#45464d",
                        "surface-container-highest": "#2e3447",
                        "on-tertiary-container": "#a47a00",
                        "primary-fixed": "#dae2fd",
                        "tertiary-container": "#211600",
                        "on-secondary-fixed": "#21005e",
                        "on-surface-variant": "#c6c6cd",
                        "primary-fixed-dim": "#bec6e0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "1rem",
                        "gutter-md": "1.5rem",
                        "container-max-width": "860px",
                        "stack-gap": "2rem"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter", "sans-serif"],
                        "display-lg": ["Noto Serif", "serif"],
                        "label-caps": ["Inter", "sans-serif"],
                        "body-main": ["Inter", "sans-serif"],
                        "header-title": ["Noto Serif", "serif"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display-lg": ["40px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-main": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "header-title": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #0c1324; }
        
        /* Custom Input Scrollbar for Textarea */
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #2e3447;
            border-radius: 10px;
        }
    </style>
</head>
<body class="font-body-main text-on-background bg-background antialiased min-h-screen relative selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Mock Background Content (Blurred) -->
<div class="absolute inset-0 pointer-events-none opacity-40 filter blur-sm flex flex-col items-center pt-20 px-4">
<div class="w-full max-w-container-max-width h-64 bg-surface-container rounded-xl border border-white/5 shadow-lg mb-6"></div>
<div class="w-full max-w-container-max-width h-40 bg-surface-container rounded-xl border border-white/5 shadow-lg"></div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-margin-mobile bg-surface-dim/80 backdrop-blur-md transition-opacity">
<!-- Modal Container (Glassmorphism + 3D Tactile) -->
<div class="w-full max-w-[500px] bg-surface-container/90 backdrop-blur-2xl rounded-xl border border-white/10 shadow-[0_16px_40px_-10px_rgba(0,0,0,0.8)] relative overflow-hidden flex flex-col transform scale-100 transition-transform">
<!-- Top Edge Highlight -->
<div class="absolute top-0 inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<!-- Header -->
<div class="flex justify-between items-center px-6 py-5 border-b border-white/5">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">edit_document</span>
<h2 class="font-header-title text-header-title text-on-surface tracking-wide">编辑摘要</h2>
</div>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-variant text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-secondary/50">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Content Body -->
<div class="px-6 py-6 flex flex-col gap-6">
<!-- Title Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase" for="memory-title">记忆标题</label>
<span class="text-[10px] text-tertiary flex items-center gap-1 opacity-80">
<span class="material-symbols-outlined text-[12px]">auto_awesome</span>
                            AI 生成
                        </span>
</div>
<!-- Concave Slot Style -->
<div class="relative group">
<input class="w-full bg-surface-dim/80 rounded-lg border border-white/5 focus:border-secondary/40 text-on-surface font-body-main text-body-main px-4 py-3 outline-none shadow-[inset_0_2px_8px_rgba(0,0,0,0.5)] transition-all placeholder:text-on-surface-variant/50 focus:bg-surface-dim" id="memory-title" type="text" value="深夜的雨声与关于未来的思绪"/>
</div>
</div>
<!-- Summary Textarea -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase" for="memory-summary">核心内容摘要</label>
<span class="text-[10px] text-tertiary flex items-center gap-1 opacity-80">
<span class="material-symbols-outlined text-[12px]">auto_awesome</span>
                            AI 提炼
                        </span>
</div>
<!-- Concave Slot Style -->
<div class="relative group">
<textarea class="w-full bg-surface-dim/80 rounded-lg border border-white/5 focus:border-secondary/40 text-on-surface font-body-main text-body-main px-4 py-3 outline-none shadow-[inset_0_2px_8px_rgba(0,0,0,0.5)] transition-all resize-none leading-relaxed placeholder:text-on-surface-variant/50 focus:bg-surface-dim" id="memory-summary" rows="5">记录了在这个下雨的深夜，对近期工作压力的一些宣泄，以及面对职业选择交叉口时的迷茫。通过倾诉，情绪逐渐平复，意识到不需要立刻找到完美的答案，而是应该先专注于眼前的每一步，给自己多一些耐心和包容。</textarea>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="px-6 py-5 flex items-center justify-between bg-surface-container-high/30 border-t border-white/5">
<!-- Regenerate Option -->
<button class="flex items-center gap-2 text-on-surface-variant hover:text-tertiary transition-colors font-body-sm text-body-sm group focus:outline-none">
<span class="material-symbols-outlined text-[18px] group-hover:-rotate-180 transition-transform duration-500">sync</span>
                    重新生成
                </button>
<!-- Primary Actions -->
<div class="flex items-center gap-3">
<button class="px-4 py-2.5 rounded-lg border border-outline-variant/50 text-on-surface-variant hover:bg-surface-variant hover:text-on-surface transition-colors font-label-caps text-label-caps focus:outline-none focus:ring-2 focus:ring-outline">
                        取消
                    </button>
<!-- Glow Button Style -->
<button class="px-6 py-2.5 rounded-lg bg-secondary-container text-on-secondary-container font-label-caps text-label-caps flex items-center gap-2 hover:bg-secondary hover:text-on-secondary transition-all shadow-[0_0_15px_rgba(79,49,156,0.3)] hover:shadow-[0_0_25px_rgba(206,189,255,0.4)] focus:outline-none focus:ring-2 focus:ring-secondary/50">
<span class="material-symbols-outlined text-[18px]">check</span>
                        保存修改
                    </button>
</div>
</div>
</div>
</div>
</body></html>
