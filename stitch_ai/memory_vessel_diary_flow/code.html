<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>登录 - Memory Vessel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Noto+Serif:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-high": "#23293c",
                        "inverse-surface": "#dce1fb",
                        "surface-tint": "#bec6e0",
                        "error": "#ffb4ab",
                        "on-tertiary": "#402d00",
                        "on-secondary": "#381385",
                        "on-secondary-fixed-variant": "#4f319c",
                        "tertiary-fixed": "#ffdf9f",
                        "tertiary": "#f9bd22",
                        "primary-container": "#0f172a",
                        "surface-bright": "#33394c",
                        "on-primary-container": "#798098",
                        "on-secondary-container": "#bea8ff",
                        "on-error": "#690005",
                        "on-background": "#dce1fb",
                        "secondary": "#cebdff",
                        "on-tertiary-fixed": "#261a00",
                        "inverse-primary": "#565e74",
                        "secondary-fixed": "#e8ddff",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#f9bd22",
                        "on-surface": "#dce1fb",
                        "surface-container-low": "#151b2d",
                        "outline": "#909097",
                        "surface-container-lowest": "#070d1f",
                        "on-primary-fixed": "#131b2e",
                        "primary": "#bec6e0",
                        "on-tertiary-fixed-variant": "#5c4300",
                        "surface-variant": "#2e3447",
                        "secondary-fixed-dim": "#cebdff",
                        "inverse-on-surface": "#2a3043",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-primary": "#283044",
                        "surface-dim": "#0c1324",
                        "error-container": "#93000a",
                        "background": "#0c1324",
                        "surface": "#0c1324",
                        "surface-container": "#191f31",
                        "secondary-container": "#4f319c",
                        "outline-variant": "#45464d",
                        "surface-container-highest": "#2e3447",
                        "on-tertiary-container": "#a47a00",
                        "primary-fixed": "#dae2fd",
                        "tertiary-container": "#211600",
                        "on-secondary-fixed": "#21005e",
                        "on-surface-variant": "#c6c6cd",
                        "primary-fixed-dim": "#bec6e0"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "margin-mobile": "1rem",
                        "gutter-md": "1.5rem",
                        "container-max-width": "860px",
                        "stack-gap": "2rem"
                    },
                    fontFamily: {
                        "body-sm": ["Inter", "sans-serif"],
                        "display-lg": ["Noto Serif", "serif"],
                        "label-caps": ["Inter", "sans-serif"],
                        "body-main": ["Inter", "sans-serif"],
                        "header-title": ["Noto Serif", "serif"]
                    },
                    fontSize: {
                        "body-sm": ["14px", { lineHeight: "1.5", fontWeight: "400" }],
                        "display-lg": ["40px", { lineHeight: "1.2", fontWeight: "700" }],
                        "label-caps": ["12px", { lineHeight: "1.2", letterSpacing: "0.05em", fontWeight: "600" }],
                        "body-main": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
                        "header-title": ["24px", { lineHeight: "1.4", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .inner-glow {
            box-shadow: inset 0 0 20px rgba(206, 189, 255, 0.05);
        }
        .soft-violet-glow {
            box-shadow: 0 0 30px rgba(79, 49, 156, 0.4);
        }
        .deep-shadow {
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile relative overflow-hidden">
<!-- Ambient Background Elements -->
<div class="absolute inset-0 z-0 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-secondary-container/20 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-surface-container-highest/30 rounded-full blur-[100px]"></div>
</div>
<!-- Login Card Container -->
<div class="relative z-10 w-full max-w-md bg-gradient-to-br from-surface-container to-primary-container rounded-xl p-8 border border-white/5 inner-glow deep-shadow">
<!-- Branding -->
<div class="flex flex-col items-center mb-8">
<span class="material-symbols-outlined text-4xl text-secondary mb-3" style="font-variation-settings: 'FILL' 0;">
                auto_awesome
            </span>
<h1 class="font-display-lg text-display-lg text-primary text-center">Memory Vessel</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 text-center">你的专属数字记忆胶囊</p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- QQ Email Input -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="qq-email">QQ 邮箱</label>
<div class="relative">
<span class="absolute inset-y-0 left-3 flex items-center text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">mail</span>
</span>
<input class="w-full bg-surface-dim border-none rounded-lg py-3 pl-10 pr-4 font-body-main text-body-main text-on-surface placeholder:text-on-surface-variant/50 focus:ring-1 focus:ring-secondary/50 shadow-inner transition-all" id="qq-email" placeholder="输入您的 QQ 邮箱" type="email"/>
</div>
</div>
<!-- Verification Code Input -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="verification-code">验证码</label>
<div class="flex gap-3">
<div class="relative flex-1">
<span class="absolute inset-y-0 left-3 flex items-center text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">password</span>
</span>
<input class="w-full bg-surface-dim border-none rounded-lg py-3 pl-10 pr-4 font-body-main text-body-main text-on-surface placeholder:text-on-surface-variant/50 focus:ring-1 focus:ring-secondary/50 shadow-inner transition-all" id="verification-code" placeholder="输入验证码" type="text"/>
</div>
<button class="px-4 py-3 bg-surface-variant hover:bg-surface-container-highest text-secondary font-label-caps text-label-caps rounded-lg border border-white/5 transition-colors whitespace-nowrap" type="button">
                        发送验证码
                    </button>
</div>
</div>
<!-- Optional Invitation Code -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block flex items-center justify-between" for="invite-code">
<span>邀请码 <span class="text-on-surface-variant/50 font-normal">(可选)</span></span>
</label>
<div class="relative">
<span class="absolute inset-y-0 left-3 flex items-center text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">vpn_key</span>
</span>
<input class="w-full bg-surface-dim border-none rounded-lg py-3 pl-10 pr-4 font-body-main text-body-main text-on-surface placeholder:text-on-surface-variant/50 focus:ring-1 focus:ring-secondary/50 shadow-inner transition-all" id="invite-code" placeholder="输入邀请码（如有）" type="text"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full bg-secondary-container hover:bg-secondary-container/90 text-on-secondary-container font-header-title text-header-title py-4 rounded-lg soft-violet-glow transition-all duration-300 transform active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
                    开启记忆之旅
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant/50 text-center mt-6">
                登录即代表您同意我们的隐私协议与服务条款
            </p>
</form>
</div>
</body></html>
